<head>
<meta charset="UTF-8">

<title>Down the Memory Lane</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Trebuchet MS",sans-serif;
}

body{
  overflow:hidden;
  background:linear-gradient(to bottom,#ffe1ec,#fff8fb);
  color:#6f5560;
}

/* TOP */

.topbar{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);

  width:min(1000px,92vw);

  display:flex;
  justify-content:space-between;
  align-items:center;

  z-index:50;
}


.logo{
  background:white;
  padding:14px 20px;
  border-radius:999px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.counter{
  position:absolute;
  left:50%;
  transform:translateX(-50%);

  background:white;
  padding:14px 20px;
  border-radius:999px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}
.music-btn{
  background:white;

  padding:14px 20px;

  border-radius:999px;

  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.music-btn{
  border:none;
  cursor:pointer;
  transition:0.2s;
}

.music-btn:hover{
  transform:scale(1.05);
}

/* MAIN */

.container{
  width:100vw;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

.game-box{
  width:min(900px,90vw);

  background:white;

  border-radius:40px;

  padding:40px;

  box-shadow:0 20px 40px rgba(0,0,0,0.08);

  text-align:center;

  position:relative;
}

.stage-title{
  font-size:2.5rem;
  margin-bottom:10px;
}

.stage-sub{
  margin-bottom:35px;
  color:#856974;
}

/* MEMORY GRID */

.memory-grid{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:20px;
}

.memory-card{
  background:#fff3f8;

  border-radius:30px;

  height:160px;

  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;

  cursor:pointer;

  transition:0.25s;

  font-size:60px;

  box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

.memory-card:hover{
  transform:translateY(-6px) rotate(2deg);
}

.memory-card.done{
  opacity:0.45;
}

.memory-label{
  font-size:15px;
  margin-top:10px;
}

/* POPUP */

.popup{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.45);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:100;

  backdrop-filter:blur(6px);
}

.popup.active{
  display:flex;
}

.popup-card{
  width:380px;

  background:white;

  border-radius:35px;

  padding:18px;

  animation:appear 0.4s ease;
}

.popup-card img{
  width:100%;
  height:320px;

  object-fit:cover;

  border-radius:25px;

  margin-bottom:15px;
}

.popup-card p{
  line-height:1.8;
  padding:10px;
}

.popup-card button{
  width:100%;

  border:none;

  margin-top:10px;

  padding:14px;

  border-radius:999px;

  background:#ff9ec2;

  color:white;

  cursor:pointer;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(0.7);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

/* NEXT BUTTON */

.next-btn{
  margin-top:30px;

  border:none;

  padding:14px 24px;

  border-radius:999px;

  background:#ff9ec2;

  color:white;

  cursor:pointer;

  display:none;
}

/* LETTER */

.big-envelope{
  width:240px;
  height:180px;

  margin:40px auto 0;

  background:white;

  border-radius:30px;

  display:none;

  justify-content:center;
  align-items:center;

  font-size:90px;

  cursor:pointer;

  box-shadow:0 15px 30px rgba(0,0,0,0.08);

  animation:bounce 1.5s infinite;
}

@keyframes bounce{
  50%{
    transform:translateY(-10px);
  }
}

/* LETTER SCREEN */

.letter-screen,
.gallery-screen{
  position:fixed;
  inset:0;

  background:rgba(255,245,249,0.97);

  display:none;

  justify-content:center;
  align-items:center;

  z-index:200;

  backdrop-filter:blur(5px);
}

.paper{
  width:min(700px,90vw);

  background:white;

  border-radius:35px;

  padding:45px;

  line-height:1.9;

  text-align:center;

  box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

.paper h1{
  margin-bottom:20px;
}

.paper button{
  margin-top:25px;

  border:none;

  padding:14px 22px;

  border-radius:999px;

  background:#ff9ec2;

  color:white;

  cursor:pointer;
}

/* ================= GALLERY ================= */
.scrapbook-wrap{
  width:100vw;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* PAGE CONTAINER */

.book{
  width:min(1100px,95vw);
  height:min(650px,85vh);

  perspective:2000px;
}

/* EACH PAGE */

.page{
  position:absolute;
  width:100%;
  height:100%;

  background:#fffafc;
  border-radius:40px;

  box-shadow:0 30px 60px rgba(0,0,0,0.15);

  padding:40px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;

  backface-visibility:hidden;

  transition:transform 0.8s ease;
}

/* hidden pages */
.page.hidden{
  transform:rotateY(180deg);
  opacity:0;
  pointer-events:none;
}

/* images inside pages */

.page img{
  width:100%;
  height:140px;

  object-fit:cover;

  border-radius:18px;

  cursor:pointer;

  box-shadow:0 10px 20px rgba(0,0,0,0.1);

  transition:0.2s;
}

.page img:hover{
  transform:scale(1.05);
}

/* navigation */

.nav{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  gap:20px;
}

.nav button{
  padding:12px 18px;
  border:none;

  border-radius:999px;

  background:#ff9ec2;
  color:white;

  cursor:pointer;
}

/* FULLSCREEN VIEW */

.viewer{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.85);

  display:none;
  justify-content:center;
  align-items:center;

  z-index:500;
}

.viewer img{
  max-width:90vw;
  max-height:90vh;

  border-radius:20px;
}



/* FLOATING */

.float{
  position:fixed;
  pointer-events:none;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  from{
    transform:translateY(100vh);
    opacity:1;
  }
  to{
    transform:translateY(-120vh);
    opacity:0;
  }
}

</style>
<script>

document.addEventListener("DOMContentLoaded", () => {

  let pages = document.querySelectorAll(".page");
  let index = 0;

  const viewer = document.createElement("div");
  viewer.className = "viewer";
  viewer.innerHTML = "<img>";
  document.body.appendChild(viewer);

  const viewerImg = viewer.querySelector("img");

  function showPage(i){
    pages.forEach((p,idx)=>{
      p.classList.toggle("hidden", idx !== i);
    });
  }

  showPage(0);

  // NAV buttons
  document.querySelectorAll(".nextPage").forEach(btn=>{
    btn.onclick = () => {
      if(index < pages.length - 1){
        index++;
        showPage(index);
      }
    };
  });

  document.querySelectorAll(".prevPage").forEach(btn=>{
    btn.onclick = () => {
      if(index > 0){
        index--;
        showPage(index);
      }
    };
  });

  // image viewer
  document.querySelectorAll(".page img").forEach(img=>{
    img.onclick = () => {
      viewer.style.display = "flex";
      viewerImg.src = img.src;
    };
  });

  viewer.onclick = () => {
    viewer.style.display = "none";
  };

});
</script>

<script>

/* MUSIC */

const music =
document.getElementById("bgMusic");

const musicBtn =
document.getElementById("musicBtn");

let playing = false;

musicBtn.onclick = ()=>{

  if(!playing){

    music.play();

    musicBtn.innerHTML = "💖";

    playing = true;

  }else{

    music.pause();

    musicBtn.innerHTML = "🎵";

    playing = false;

  }

};

/* POPUP */

const popup =
document.getElementById("popup");

const popupImg =
document.getElementById("popupImg");

const popupText =
document.getElementById("popupText");

document
.getElementById("closePopup")
.onclick = ()=>{

  popup.classList.remove("active");

};

/* STAGES */

const cards =
document.querySelectorAll(".memory-card");

const nextBtn =
document.getElementById("nextBtn");

const counter =
document.getElementById("counter");

const title =
document.getElementById("stageTitle");

const sub =
document.getElementById("stageSub");

const envelope =
document.getElementById("envelope");

let total = 0;

let stage = "past";

let stageCount = 0;

cards.forEach(card=>{

  card.addEventListener("click",()=>{

    if(card.classList.contains("done"))
    return;

    if(card.dataset.stage !== stage)
    return;

    card.classList.add("done");

    popup.classList.add("active");

    popupImg.src = card.dataset.img;

    popupText.textContent =
    card.dataset.text;

    total++;

    stageCount++;

    counter.textContent = total;

    if(stageCount === 3){

      if(stage !== "future"){

        nextBtn.style.display =
        "inline-block";

      }else{

        envelope.style.display =
        "flex";

      }

    }

  });

});

/* NEXT STAGE */

nextBtn.onclick = ()=>{

  nextBtn.style.display = "none";

  stageCount = 0;

  if(stage === "past"){

    stage = "present";

    title.innerHTML =
    "👶👶";

    sub.innerHTML =
    "";

  }else if(stage === "present"){

    stage = "future";

    title.innerHTML =
    "👨🏽‍👩‍👧‍👧🏻";

    sub.innerHTML =
    "";

  }

  cards.forEach(card=>{

    if(card.dataset.stage === stage){

      card.style.display = "flex";

    }

  });

};

const fullLetter = `Good morning mem,

Naka think ko pag bata namo mas kuan mis DIY basta events dayon imo gyud permi e keep amo gifts🥹

I wanted to do something like that again now cuz I feel like DIY gifts are more special because galing sa heart and I wanted to make you feel special on this day.

function openLetter(){

  document.getElementById("letterScreen").style.display = "flex";

  const textEl = document.getElementById("letterText");
  const music = document.getElementById("letterMusic");

  textEl.innerHTML = "";

  let i = 0;

  // 🎵 soft music fade in
  if(music){
    music.volume = 0;
    music.play();

    let v = 0;
    const fade = setInterval(()=>{
      if(v < 0.6){
        v += 0.05;
        music.volume = v;
      } else {
        clearInterval(fade);
      }
    },150);
  }

  // ⌨️ typing effect
  function type(){
    if(i < fullLetter.length){
      textEl.innerHTML += fullLetter[i] === "\n" ? "<br>" : fullLetter[i];
      i++;
      setTimeout(type, 25);
    }
  }

  type();
}

function closeLetter(){
  document.getElementById("letterScreen").style.display = "none";

  const music = document.getElementById("letterMusic");
  if(music) music.pause();
}

/* FLOATING */

function createFloat(){

  const float =
  document.createElement("div");

  float.classList.add("float");

  float.innerHTML =
  ["🌸","💖","✨","💌"]
  [Math.floor(Math.random()*4)];

  float.style.left =
  Math.random()*100 + "vw";

  float.style.fontSize =
  (15 + Math.random()*18) + "px";

  float.style.animationDuration =
  (5 + Math.random()*5) + "s";

  document.body.appendChild(float);

  setTimeout(()=>{
    float.remove();
  },10000);

}

setInterval(createFloat,800);
